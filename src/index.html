<!DOCTYPE html>
<html>
  <head>
    <title>Youtube.com Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../resources/styles/general.css" />
    <link rel="stylesheet" href="../resources/styles/header.css" />
    <link rel="stylesheet" href="../resources/styles/video.css" />
    <link rel="stylesheet" href="../resources/styles/sidebar.css" />
  </head>
  <body>
    <header class="header">
      <div class="left-section">
        <img class="hamburger-logo" src="../resources/hamburger-menu.svg" />
        <img class="youtube-logo" src="../resources/youtube-logo.svg" />
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-button">
          <img class="search-icon" src="../resources/search.svg" />
          <div class="tooltip">Search</div>
        </button>
        <button class="voice-search-button">
          <img
            class="voice-search-icon"
            src="../resources/voice-search-icon.svg"
          />
          <div class="tooltip">Search with your voice</div>
        </button>
      </div>
      <div class="right-section">
        <div class="upload-icon-container">
          <img class="upload-icon" src="../resources/upload.svg" />
          <div class="tooltip">Create</div>
        </div>
        <div class="youtube-apps-icon-container">
          <img class="youtube-apps-icon" src="../resources/youtube-apps.svg" />
          <div class="tooltip">Youtube apps</div>
        </div>
        <div class="notifications-icon-container">
          <img
            class="notifications-icon"
            src="../resources/notifications.svg"
          />
          <div class="notifications-count">3</div>
          <div class="tooltip">Notifications</div>
        </div>
        <img
          class="current-user-picture-icon"
          src="../resources/my-channel.jpg"
        />
      </div>
    </header>
    <nav class="sidebar">
      <div class="sidebar-link">
        <img src="../resources/home.svg" />
        <div>Home</div>
      </div>
      <div class="sidebar-link">
        <img src="../resources/explore.svg" />
        <div>Explore</div>
      </div>
      <div class="sidebar-link">
        <img src="../resources/subscriptions.svg" />
        <div>Subscriptions</div>
      </div>
      <div class="sidebar-link">
        <img src="../resources/originals.svg" />
        <div>Originals</div>
      </div>
      <div class="sidebar-link">
        <img src="../resources/youtube-music.svg" />
        <div>Youtube Music</div>
      </div>
      <div class="sidebar-link">
        <img src="../resources/library.svg" />
        <div>Library</div>
      </div>
    </nav>
  </body>
</html>
